<!-- edit_modal.html -->
<div x-show="editModal"
     class="fixed inset-0 z-[60] overflow-y-auto"
     x-cloak>

    <!-- Orqa fon (Overlay) -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" @click="editModal = false"></div>

    <!-- Modal Kontenti -->
    <div class="flex min-h-full items-center justify-center p-4">
        <div class="vibrant-card relative w-full max-w-2xl p-8 md:p-10 shadow-2xl overflow-hidden"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">

            <!-- Bezak -->
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 to-purple-600"></div>

            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-black text-slate-900">Profilni tahrirlash</h3>
                <button @click="editModal = false" class="text-slate-400 hover:text-slate-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <!-- Rasm yuklash -->
                <div class="flex items-center space-x-6 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <div class="w-20 h-20 rounded-2xl overflow-hidden shadow-md">
                        <img src="{{ user.profile.image.url }}" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Profil rasmi</label>
                        {{ p_form.image }}
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Ism</label>
                        <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full p-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 outline-none transition font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Familiya</label>
                        <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full p-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 outline-none transition font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Telefon</label>
                        <input type="text" name="phone_number" value="{{ user.profile.phone_number|default:'' }}" class="w-full p-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 outline-none transition font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Maktab/OTM</label>
                        <input type="text" name="school" value="{{ user.profile.school|default:'' }}" class="w-full p-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 outline-none transition font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">O'zingiz haqingizda</label>
                    <textarea name="bio" rows="3" class="w-full p-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 outline-none transition font-medium">{{ user.profile.bio|default:'' }}</textarea>
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="submit" class="flex-1 btn-primary text-white py-4 rounded-2xl font-bold shadow-lg">
                        Saqlash
                    </button>
                    <button type="button" @click="editModal = false" class="flex-1 bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold hover:bg-slate-200 transition">
                        Bekor qilish
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
