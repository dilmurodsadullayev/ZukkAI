{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 md:px-6">
    <div class="text-center mb-16" data-aos="fade-down">
        <h1 class="text-5xl font-black text-slate-900 italic mb-4 tracking-tighter">Bilimingizni sinab ko'ring</h1>
        <p class="text-slate-500 text-lg font-medium">Mavzular bo'yicha interaktiv testlarni yeching va o'zlashtirish darajangizni aniqlang</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for quiz in quizzes %}
        <div class="vibrant-card p-10 border border-slate-100 relative group overflow-hidden" data-aos="fade-up">
            <!-- Bezak Ikonka -->
            <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mb-8 group-hover:scale-110 group-hover:rotate-6 transition-transform">
                <i class="fas fa-file-signature text-3xl"></i>
            </div>

            <h3 class="text-2xl font-black text-slate-900 mb-3 italic">{{ quiz.title }}</h3>
            <p class="text-slate-400 font-medium mb-8 leading-relaxed line-clamp-3">{{ quiz.description }}</p>
            
            <div class="flex items-center justify-between pt-6 border-t border-slate-50">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest italic">{{ quiz.topic.title }}</span>
                <a href="{% url 'quiz_detail' quiz.pk %}" class="btn-primary text-white px-8 py-3 rounded-xl font-bold shadow-lg">
                    Testni boshlash
                </a>
            </div>

            <!-- Background Glow -->
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/5 blur-3xl rounded-full"></div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
