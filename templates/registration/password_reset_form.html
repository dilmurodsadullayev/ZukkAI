{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto px-6 py-10 md:py-20" data-aos="zoom-in">
    <div class="vibrant-card p-10 border border-slate-100 relative overflow-hidden bg-white shadow-2xl">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 to-blue-600"></div>
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mx-auto mb-4">
                <i class="fas fa-key text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900">Parolni tiklash</h2>
            <p class="text-slate-400 mt-2 font-medium">Email manzilingizni kiriting, biz sizga havola yuboramiz.</p>
        </div>
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Email</label>
                <input type="email" name="email" placeholder="misol@mail.com" required
                    class="w-full p-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 outline-none transition-all font-bold">
            </div>
            <button type="submit" class="w-full btn-primary text-white py-4 rounded-2xl font-black shadow-lg">Havolani yuborish</button>
        </form>
    </div>
</div>
{% endblock %}
