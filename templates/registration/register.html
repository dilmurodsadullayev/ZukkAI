{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 md:px-6 py-10 md:py-16 flex justify-center items-center"
     x-data="{ showPw: false, showPwConf: false }">

    <div class="w-full max-w-lg" data-aos="zoom-in">

        <!-- ALERT TIZIMI (Sayt allerti) -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 rounded-2xl flex items-center shadow-lg transform transition-all animate-bounce
                    {% if message.tags == 'success' %} bg-emerald-100 text-emerald-700 border-2 border-emerald-200 {% else %} bg-red-100 text-red-700 border-2 border-red-200 {% endif %}">
                    <i class="fas {% if message.tags == 'success' %} fa-check-circle {% else %} fa-exclamation-triangle {% endif %} mr-3 text-xl"></i>
                    <span class="font-bold">{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <div class="vibrant-card p-8 md:p-12 border border-slate-100 relative overflow-hidden">
            <!-- Yuqori dekorativ chiziq -->
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 to-purple-600"></div>

            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mx-auto mb-4 shadow-inner">
                    <i class="fas fa-user-plus text-2xl"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight italic">Ro'yxatdan o'tish</h2>
                <p class="text-slate-400 mt-2 font-medium">ZukkAI hamjamiyatiga qo'shiling</p>
            </div>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <!-- Username -->
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Foydalanuvchi nomi</label>
                    <div class="relative">
                        <i class="fas fa-at absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="text" name="username" placeholder="mrrobot" required
                            class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all font-bold text-slate-700">
                    </div>
                </div>

                <!-- Email -->
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Email manzili</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="email" name="email" placeholder="example@mail.com" required
                            class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all font-bold text-slate-700">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Parol yaratish</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input :type="showPw ? 'text' : 'password'" name="password" placeholder="••••••••" required
                            class="w-full pl-12 pr-12 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all font-bold text-slate-700">
                        <!-- Ko'zcha ikonkasi -->
                        <button type="button" @click="showPw = !showPw" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-indigo-600 transition">
                            <i class="fas" :class="showPw ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-2">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Parolni takrorlang</label>
                    <div class="relative">
                        <i class="fas fa-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input :type="showPwConf ? 'text' : 'password'" name="confirm_password" placeholder="••••••••" required
                            class="w-full pl-12 pr-12 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all font-bold text-slate-700">
                        <button type="button" @click="showPwConf = !showPwConf" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-indigo-600 transition">
                            <i class="fas" :class="showPwConf ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full btn-primary text-white py-5 rounded-[22px] font-black text-xl shadow-2xl shadow-indigo-100 hover:scale-[1.02] active:scale-95 transition-all mt-4">
                    Ro'yxatdan o'tish <i class="fas fa-user-check ml-2"></i>
                </button>
            </form>

            <p class="text-center mt-10 text-slate-500 font-medium">
                Hisobingiz bormi? <a href="{% url 'login' %}" class="text-indigo-600 font-black hover:underline underline-offset-4">Tizimga kiring</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
