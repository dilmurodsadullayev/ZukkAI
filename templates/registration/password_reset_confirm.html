{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto px-6 py-10 md:py-20" x-data="{ showPw: false }">
    <div class="vibrant-card p-10 border border-slate-100 bg-white shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-500 to-indigo-600"></div>
        <h2 class="text-2xl font-black text-slate-900 mb-6">Yangi parol o'rnating</h2>
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }} <!-- Django parolni tekshirish formasi -->
            </div>
            <button type="submit" class="w-full btn-primary text-white py-4 rounded-2xl font-black shadow-lg mt-4">Parolni saqlash</button>
        </form>
    </div>
</div>
{% endblock %}
